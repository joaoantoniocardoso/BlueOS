[workspace]
resolver = "2"
members = [
    "app/blueos",
    "libs/adapters/comms",
    "libs/adapters/comms-zenoh",
    "libs/adapters/logging",
    "libs/adapters/settings",
    "libs/api",
    "libs/app/service",
    "libs/logic/domain",
    "libs/logic/jobs",
    "libs/logic/ros2-names",
    "libs/idl",
    "libs/idl/codegen",
    "libs/tools/rust-style-check",
    "services/recorder/adapters/mavlink",
    "services/recorder/adapters/mcap",
    "services/recorder/adapters/storage",
    "services/recorder/app",
    "services/recorder/logic/api",
    "services/recorder/logic/cameras",
    "services/recorder/logic/paths",
    "services/recorder/logic/capture",
    "services/recorder/logic/library",
    "services/recorder/logic/recorder",
    "services/recorder/logic/schema-gate",
    "services/example/app",
    "services/example/cookbook",
    "services/example/logic/api",
    "services/example/logic/domain",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
panic = "unwind"
strip = true

[workspace.dependencies]
blueos-api = { path = "libs/api" }
blueos-comms = { path = "libs/adapters/comms" }
blueos-comms-zenoh = { path = "libs/adapters/comms-zenoh" }
blueos-logging = { path = "libs/adapters/logging" }
blueos-domain = { path = "libs/logic/domain" }
blueos-jobs = { path = "libs/logic/jobs" }
blueos-ros2-names = { path = "libs/logic/ros2-names" }
blueos-service = { path = "libs/app/service" }
blueos-settings = { path = "libs/adapters/settings" }
blueos-recorder-api = { path = "services/recorder/logic/api" }
blueos-recorder-app = { path = "services/recorder/app" }
blueos-recorder-cameras = { path = "services/recorder/logic/cameras" }
blueos-recorder-library = { path = "services/recorder/logic/library" }
blueos-recorder-paths = { path = "services/recorder/logic/paths" }
blueos-recorder-capture = { path = "services/recorder/logic/capture" }
blueos-recorder-domain = { path = "services/recorder/logic/recorder" }
blueos-recorder-mavlink = { path = "services/recorder/adapters/mavlink" }
blueos-example-api = { path = "services/example/logic/api" }
blueos-example-app = { path = "services/example/app" }
blueos-example-domain = { path = "services/example/logic/domain" }
blueos-recorder-mcap = { path = "services/recorder/adapters/mcap" }
blueos-recorder-schema-gate = { path = "services/recorder/logic/schema-gate" }
blueos-recorder-storage = { path = "services/recorder/adapters/storage" }
blueos-idl = { path = "libs/idl" }
blueos-idl-codegen = { path = "libs/idl/codegen" }
blueos-rust-style-check = { path = "libs/tools/rust-style-check" }
anyhow = { version = "1.0", default-features = false }
bytes = { version = "1.12", default-features = false }
clap = { version = "4.5", default-features = false }
convert_case = "0.8"
futures-util = { version = "0.3.32", default-features = false }
json5 = "0.4"
mcap = "0.25.0"
prettyplease = "0.2"
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = "1"
roslibrust_codegen = { version = "0.26.0", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "visit"] }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.53", default-features = false }
backon = { version = "1.6", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt", "time"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["env-filter", "fmt", "std"] }
trybuild = { version = "1.0.121", default-features = false }
walkdir = { version = "2", default-features = false }
zenoh = { version = "=1.9.0", default-features = false, features = ["shared-memory", "transport_tcp"] }
zenoh-keyexpr = { version = "=1.9.0", default-features = false }
mavlink = { version = "0.18.0", default-features = false, features = ["std", "dialect-ardupilotmega"] }
mavlink-codec = { git = "https://github.com/joaoantoniocardoso/rust-mavlink-codec", rev = "577d04e1a60638b6ccab6729444cdb2e8201d8d8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
alloc_instead_of_core = "deny"
arbitrary_source_item_ordering = "deny"
await_holding_lock = "deny"
clone_on_copy = "warn"
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
min_ident_chars = "deny"
pub_use = "deny"
redundant_clone = "warn"
shadow_unrelated = "deny"
std_instead_of_core = "deny"
wildcard_imports = "deny"
