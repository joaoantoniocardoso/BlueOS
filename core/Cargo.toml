[workspace]
resolver = "2"
members = [
    "app/blueos",
    "libs/api",
    "libs/idl",
    "libs/adapters/cli",
    "libs/adapters/comms",
    "libs/adapters/comms/channel",
    "libs/adapters/comms/driver",
    "libs/adapters/comms/zenoh",
    "libs/adapters/logging",
    "libs/adapters/settings",
    "libs/app/service",
    "libs/logic/cqrs",
    "libs/logic/jobs",
    "services/example/adapters/simulated_pump",
    "services/example/app",
    "services/example/logic/pump",
    "services/recorder/adapters/mavlink",
    "services/recorder/adapters/mcap",
    "services/recorder/app",
    "services/recorder/logic/policy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
panic = "unwind"
strip = true

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1"
blueos-api = { path = "libs/api" }
blueos-cli = { path = "libs/adapters/cli" }
blueos-comms = { path = "libs/adapters/comms", default-features = false }
blueos-comms-channel = { path = "libs/adapters/comms/channel" }
blueos-comms-driver = { path = "libs/adapters/comms/driver" }
blueos-comms-zenoh = { path = "libs/adapters/comms/zenoh" }
blueos-cqrs = { path = "libs/logic/cqrs" }
blueos-example = { path = "services/example/app" }
blueos-example-pump = { path = "services/example/logic/pump" }
blueos-example-simulated-pump = { path = "services/example/adapters/simulated_pump" }
blueos-idl = { path = "libs/idl" }
blueos-idl-codegen = { path = "libs/idl/codegen" }
blueos-jobs = { path = "libs/logic/jobs" }
blueos-logging = { path = "libs/adapters/logging" }
blueos-recorder = { path = "services/recorder/app" }
blueos-recorder-mavlink = { path = "services/recorder/adapters/mavlink" }
blueos-recorder-mcap = { path = "services/recorder/adapters/mcap" }
blueos-recorder-policy = { path = "services/recorder/logic/policy" }
blueos-service = { path = "libs/app/service" }
blueos-settings = { path = "libs/adapters/settings" }
bytes = "1"
chrono = "0.4.41"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
json5 = "0.4"
log = "0.4"
mavlink = { version = "0.18.0", default-features = false, features = ["std", "dialect-ardupilotmega"] }
mavlink-codec = { git = "https://github.com/joaoantoniocardoso/rust-mavlink-codec", rev = "577d04e1a60638b6ccab6729444cdb2e8201d8d8" }
mcap = "0.25.0"
serde = { version = "1", features = ["derive"] }
serde_arrays = { version = "0.2", default-features = false }
serde_json = "1"
thiserror = { version = "2", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenoh = { version = "=1.9.0", default-features = false, features = ["shared-memory", "transport_tcp"] }
