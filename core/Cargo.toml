[workspace]
resolver = "2"
default-members = ["app/blueos"]
members = [
    "app/blueos",
    "libs/adapters/comms",
    "libs/adapters/comms-zenoh",
    "libs/adapters/logging",
    "libs/adapters/settings",
    "libs/api",
    "libs/app/service",
    "libs/logic/domain",
    "libs/logic/jobs",
    "libs/logic/ros2-names",
    "libs/idl",
    "libs/idl/codegen",
    "libs/tools/rust-style-check",
    "services/recorder/adapters/mavlink",
    "services/recorder/adapters/mcap",
    "services/recorder/adapters/storage",
    "services/recorder/app",
    "services/recorder/logic/api",
    "services/recorder/logic/cameras",
    "services/recorder/logic/paths",
    "services/recorder/logic/capture",
    "services/recorder/logic/library",
    "services/recorder/logic/recorder",
    "services/recorder/logic/schema-gate",
    "services/example/app",
    "services/example/cookbook",
    "services/example/logic/api",
    "services/example/logic/domain",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
panic = "unwind"
strip = true

[profile.bench]
strip = false

[workspace.dependencies]
blueos-api = { path = "libs/api", default-features = false }
blueos-comms = { path = "libs/adapters/comms", default-features = false }
blueos-comms-zenoh = { path = "libs/adapters/comms-zenoh", default-features = false }
blueos-logging = { path = "libs/adapters/logging", default-features = false }
blueos-domain = { path = "libs/logic/domain", default-features = false }
blueos-jobs = { path = "libs/logic/jobs", default-features = false }
blueos-ros2-names = { path = "libs/logic/ros2-names", default-features = false }
blueos-service = { path = "libs/app/service", default-features = false }
blueos-settings = { path = "libs/adapters/settings", default-features = false }
blueos-recorder-api = { path = "services/recorder/logic/api", default-features = false }
blueos-recorder-app = { path = "services/recorder/app", default-features = false }
blueos-recorder-cameras = { path = "services/recorder/logic/cameras", default-features = false }
blueos-recorder-library = { path = "services/recorder/logic/library", default-features = false }
blueos-recorder-paths = { path = "services/recorder/logic/paths", default-features = false }
blueos-recorder-capture = { path = "services/recorder/logic/capture", default-features = false }
blueos-recorder-domain = { path = "services/recorder/logic/recorder", default-features = false }
blueos-recorder-mavlink = { path = "services/recorder/adapters/mavlink", default-features = false }
blueos-example-api = { path = "services/example/logic/api", default-features = false }
blueos-example-app = { path = "services/example/app", default-features = false }
blueos-example-domain = { path = "services/example/logic/domain", default-features = false }
blueos-recorder-mcap = { path = "services/recorder/adapters/mcap", default-features = false }
blueos-recorder-schema-gate = { path = "services/recorder/logic/schema-gate", default-features = false }
blueos-recorder-storage = { path = "services/recorder/adapters/storage", default-features = false }
blueos-idl = { path = "libs/idl", default-features = false }
blueos-idl-codegen = { path = "libs/idl/codegen", default-features = false }
bytes = { version = "1.12", default-features = false }
clap = { version = "4.5", default-features = false }
convert_case = { version = "0.8", default-features = false }
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
gungraun = { version = "0.20.0", default-features = false, features = ["default"] }
futures-util = { version = "0.3.32", default-features = false }
json5 = { version = "0.4", default-features = false }
mcap = { version = "0.25.0", default-features = false, features = ["lz4"] }
metrics = { version = "0.24.6", default-features = false }
prettyplease = { version = "0.2", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
proptest-state-machine = { version = "0.8.0", default-features = false, features = ["std"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
roslibrust_codegen = { version = "0.26.0", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_arrays = { version = "0.2", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "visit"] }
tempfile = { version = "3", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.53", default-features = false }
backon = { version = "1.6", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt", "time"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["env-filter", "fmt", "std"] }
trybuild = { version = "1.0.121", default-features = false }
walkdir = { version = "2", default-features = false }
zenoh = { version = "=1.9.0", default-features = false, features = ["shared-memory", "transport_tcp"] }
zenoh-keyexpr = { version = "=1.9.0", default-features = false }
mavlink = { version = "0.18.0", default-features = false, features = ["std", "dialect-ardupilotmega", "mav2-message-extensions"] }
mavlink-codec = { git = "https://github.com/joaoantoniocardoso/rust-mavlink-codec", rev = "577d04e1a60638b6ccab6729444cdb2e8201d8d8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
alloc_instead_of_core = "deny"
arbitrary_source_item_ordering = "deny"
await_holding_lock = "deny"
clone_on_copy = "warn"
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
min_ident_chars = "deny"
pub_use = "deny"
redundant_clone = "warn"
shadow_unrelated = "deny"
std_instead_of_core = "deny"
wildcard_imports = "deny"
