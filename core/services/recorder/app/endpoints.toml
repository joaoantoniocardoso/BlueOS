# The endpoints of the recorder Service. After changing this file, regenerate with:
#   cargo run -p blueos-idl-codegen -- --write

service = "recorder"

[job]
Start = { type = "blueos_recorder_msgs/action/StartRecording" }
Stop = { type = "blueos_recorder_msgs/action/StopRecording" }
DeleteRecording = { type = "blueos_recorder_msgs/action/DeleteRecording", nature = { lasting = true } }
RepairRecording = { type = "blueos_recorder_msgs/action/RepairRecording", nature = { lasting = true, cancellable = true } }
SnapshotRecording = { type = "blueos_recorder_msgs/action/SnapshotRecording", nature = { lasting = true } }

[query]
bytes = { type = "blueos_recorder_msgs/srv/RecordingBytes", io = true }
index = { type = "blueos_recorder_msgs/srv/RecordingIndex", io = true }

[state]
recording = { type = "blueos_recorder_msgs/msg/RecordingState" }
library = { type = "blueos_recorder_msgs/msg/RecordingLibrary" }
