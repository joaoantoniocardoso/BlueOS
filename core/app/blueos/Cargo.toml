[package]
name = "blueos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "blueos"
path = "src/main.rs"

[features]
default = []
example = ["dep:example"]
recorder = ["dep:recorder"]

[dependencies]
example = { package = "example_service", path = "../../services/example/app", optional = true }
recorder = { package = "blueos-recorder", path = "../../services/recorder/app", optional = true }
