[package]
name = "blueos-logging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only: injectable timestamps and custom console writers.
testing = []

[dependencies]
blueos-comms.workspace = true
blueos-idl.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "registry", "std"] }

[dev-dependencies]
blueos-comms = { workspace = true, features = ["channel"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
