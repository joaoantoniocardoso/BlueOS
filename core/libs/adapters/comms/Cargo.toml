[package]
name = "blueos-comms"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only: enable it in [dev-dependencies] only, never in [dependencies].
channel = ["dep:tokio", "dep:zenoh-keyexpr"]

[dependencies]
bytes.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
zenoh-keyexpr = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
blueos-comms = { workspace = true, features = ["channel"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
