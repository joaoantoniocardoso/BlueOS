[package]
name = "blueos-idl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "BlueOS ROS 2 message definitions with CDR codec and embedded schemas"
repository = "https://github.com/bluerobotics/BlueOS"
publish = true
include = [
    "/Cargo.toml",
    "/README.md",
    "/api.lock",
    "/src/**/*",
    "/typescript/**/*",
    "/interfaces/**/*.msg",
    "/interfaces/**/*.srv",
    "/interfaces/**/*.action",
    "/interfaces/**/package.xml",
    "/catalog/**/*",
    "/tests/vectors/cdr.json",
]

[features]
catalog = []

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_arrays.workspace = true

[dev-dependencies]
blueos-idl-codegen.workspace = true
criterion.workspace = true
proptest.workspace = true
serde_json.workspace = true

[[bench]]
name = "cdr_codec"
harness = false

[package.metadata.proptest]
regressions = "proptest-regressions"

[[test]]
name = "catalog"
required-features = ["catalog"]

[package.metadata.cargo-machete]
ignored = ["serde_arrays"]
