[package]
name = "blueos-idl-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "blueos-idl-codegen"

[dependencies]
convert_case.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
roslibrust_codegen.workspace = true
serde.workspace = true
sha2.workspace = true
syn.workspace = true
thiserror.workspace = true
toml.workspace = true

[[bin]]
name = "blueos-idl-codegen"
path = "src/main.rs"

[[bin]]
name = "blueos-idl-print-lock"
path = "src/bin/print_lock.rs"

[[bin]]
name = "blueos-idl-codegen-catalog"
path = "src/bin/generate_catalog.rs"
