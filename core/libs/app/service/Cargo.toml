[package]
name = "blueos-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only: enable it in [dev-dependencies] only, never in [dependencies].
testing = ["blueos-comms/channel"]
[dependencies]
blueos-api.workspace = true
blueos-comms.workspace = true
blueos-comms-zenoh.workspace = true
blueos-domain.workspace = true
blueos-idl.workspace = true
blueos-jobs = { workspace = true, features = ["serde"] }
blueos-logging.workspace = true
blueos-settings.workspace = true
backon.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env", "std"] }
futures-util = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt", "time"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
blueos-example-domain = { workspace = true }
blueos-comms = { workspace = true, features = ["channel"] }
blueos-comms-zenoh.workspace = true
blueos-logging = { workspace = true, features = ["testing"] }
blueos-service = { workspace = true, features = ["testing"] }
blueos-settings.workspace = true
clap = { workspace = true, features = ["derive", "env", "std"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tracing-subscriber.workspace = true
tempfile = "3"

[lints]
workspace = true
