[package]
name = "blueos-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only: enable it in [dev-dependencies] only, never in [dependencies].
testing = ["blueos-comms/channel"]
# Minimal Service for multicall tests and the `blueos` binary when built with `--features probe`.
probe = []

[dependencies]
blueos-api.workspace = true
blueos-comms.workspace = true
blueos-domain.workspace = true
blueos-idl.workspace = true
blueos-jobs.workspace = true
blueos-settings.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env", "std"] }
futures-util = { workspace = true, features = ["std"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["time"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber.workspace = true

[dev-dependencies]
blueos-service = { workspace = true, features = ["testing"] }
blueos-settings.workspace = true
clap = { workspace = true, features = ["derive", "env", "std"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
