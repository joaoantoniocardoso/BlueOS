[package]
name = "blueos-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only: enable it in [dev-dependencies] only, never in [dependencies].
testing = ["blueos-comms/channel"]

[dependencies]
blueos-api.workspace = true
blueos-comms.workspace = true
blueos-domain.workspace = true
blueos-idl.workspace = true
blueos-settings.workspace = true
bytes.workspace = true
serde_json.workspace = true
clap = { workspace = true, features = ["std"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
blueos-service = { workspace = true, features = ["testing"] }
blueos-settings.workspace = true
clap = { workspace = true, features = ["derive", "std"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
