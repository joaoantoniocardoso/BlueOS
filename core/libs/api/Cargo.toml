[package]
name = "blueos-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "BlueOS zenoh key conventions, encodings, and schema evolution helpers"
readme = "README.md"
repository = "https://github.com/bluerobotics/BlueOS"
publish = true

[lints]
workspace = true

[dependencies]
blueos-idl = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive", "std"] }
serde_json = "1"
