# Finding ceilings per category for rustqual and thailint (D-30). A ceiling may only fall: the commit that
# fixes findings lowers it with ./.hooks/pre-push --fix. Raising one needs its own commit and a D-30 note.
[rustqual]
violations = 48
complexity_warnings = 25
magic_number_warnings = 145
nesting_depth_warnings = 1
function_length_warnings = 42
unsafe_warnings = 0
error_handling_warnings = 42
duplicate_groups = 21
dead_code_warnings = 34
dead_type_warnings = 145
fragment_groups = 38
boilerplate_warnings = 33
srp_struct_warnings = 6
srp_module_warnings = 34
wildcard_import_warnings = 0
sdp_violations = 0
coupling_warnings = 0
coupling_cycles = 0
tq_no_assertion_warnings = 0
tq_no_sut_warnings = 2
tq_untested_warnings = 14
tq_uncovered_warnings = 0
tq_untested_logic_warnings = 0
structural_srp_warnings = 0
structural_coupling_warnings = 10
total_findings = 661

[thailint]
"unwrap-abuse.unwrap-call" = 6
"unwrap-abuse.expect-call" = 0
"clone-abuse.clone-in-loop" = 60
"clone-abuse.clone-chain" = 0
"clone-abuse.unnecessary-clone" = 5
"blocking-async.fs-in-async" = 0
"blocking-async.net-in-async" = 0
"blocking-async.sleep-in-async" = 0
