# Rules for crates.io crates. Workspace crates follow the folder rules in .hooks/lib/rust_checks.sh instead.

[graph]
exclude-dev = true

[bans]
multiple-versions = "allow"
deny = [
    { crate = "zenoh", wrappers = ["blueos-comms-zenoh"], reason = "zenoh stays behind the zenoh driver" },
]

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0041", reason = "patched in lz4_flex 0.11.6, but zenoh-transport 1.9.0 (pinned by zenoh =1.9.0) requires lz4_flex ^0.10; the affected decompression only compiles under zenoh's transport_compression feature, which is off" },
    { id = "RUSTSEC-2026-0194", reason = "patched in quick-xml 0.41.0, but mavlink-bindgen 0.18.0 (the build dependency of mavlink 0.18) requires quick-xml ^0.39; it only parses the MAVLink definitions bundled with mavlink, at build time" },
    { id = "RUSTSEC-2026-0195", reason = "patched in quick-xml 0.41.0, but mavlink-bindgen 0.18.0 (the build dependency of mavlink 0.18) requires quick-xml ^0.39; it only parses the MAVLink definitions bundled with mavlink, at build time" },
    { id = "RUSTSEC-2024-0436", reason = "no patch exists: paste is unmaintained with no successor; mcap 0.25 and token-cell 2.1 (through zenoh-keyexpr) pull it in as a proc-macro, so it only runs at build time" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "EPL-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/joaoantoniocardoso/rust-mavlink-codec",
]
