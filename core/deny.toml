# Rules for crates.io crates. Workspace crates follow the folder rules in .hooks/lib/rust_checks.sh instead.

[graph]
exclude-dev = true

[bans]
multiple-versions = "allow"
deny = [
    { crate = "zenoh", wrappers = ["blueos-comms-zenoh"], reason = "zenoh stays behind the zenoh driver" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "EPL-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/joaoantoniocardoso/rust-mavlink-codec",
]
