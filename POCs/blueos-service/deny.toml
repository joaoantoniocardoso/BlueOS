# Rules for crates.io crates. Workspace crates follow the folder rules in .hooks/lib/rust_checks.sh instead.
# Run `cargo deny check bans` from this directory.

[graph]
exclude-dev = true

[bans]
multiple-versions = "allow"
deny = [
    { crate = "zenoh", wrappers = ["blueos_comms_zenoh"], reason = "zenoh stays behind the zenoh driver" },
]
