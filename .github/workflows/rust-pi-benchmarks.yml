name: Rust Pi benchmarks

env:
  CARGO_TERM_COLOR: never

on:
  push:
    branches:
      - master

jobs:
  pi-benchmarks:
    if: github.repository_owner == 'bluerobotics'
    # D-33 reference hardware (32-bit Pi 4 today). Switch to pi5-builder when D-33 moves to Pi 5.
    # The env context is not available in runs-on, so the runner name is written here.
    runs-on: pi4-builder2
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: rust-pi-benchmarks

      - name: Install Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Install cross-build tools
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5,cargo-auditable@0.7.6

      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine@1.20.0

      - name: Pi wall-clock benchmarks
        env:
          BENCHMARK_ARTIFACT_DIR: pi-benchmark-artifacts
        run: |
          mkdir -p "${BENCHMARK_ARTIFACT_DIR}"
          # shellcheck disable=SC1091
          ../.github/lib/rust_pi_benchmarks.sh "${BENCHMARK_ARTIFACT_DIR}"
        working-directory: core

      - name: Upload Pi benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pi-benchmarks-${{ github.sha }}
          path: core/pi-benchmark-artifacts/
          retention-days: 90
          if-no-files-found: error
