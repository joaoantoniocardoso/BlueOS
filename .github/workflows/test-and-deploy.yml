name: Test, Build and Deploy Images

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

on:
    workflow_dispatch:
    pull_request:
    push:
    schedule:
    # Run every 6 days to keep our caches alive
    - cron: '0 0 */6 * *'

jobs:
  python-tests:
    runs-on: ubuntu-latest

    env:
      python-version: 3.11 # Our base image has Python 3.11

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ env.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get install --no-install-recommends --assume-yes shellcheck parallel

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v8.0.0

    - name: Run tests
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        SKIP_RUST_CHECKS: 1
      run: |
        .hooks/pre-push

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: ./core/htmlcov
        if-no-files-found: ignore


  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bun install
        run: bun install --frozen-lockfile --cwd ./core/frontend

      - name: Bun lint
        run: bun --cwd ./core/frontend lint

      - name: Bun type-check
        run: bun run --cwd ./core/frontend type-check

      - name: Bun test
        run: bun run --cwd ./core/frontend test

      - name: Bun build
        run: NODE_OPTIONS=--max-old-space-size=8192 bun run --cwd ./core/frontend build

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,wasm32-unknown-unknown

      - name: Install quality tools
        uses: ./.github/actions/quality-tools

      - name: Rust lint checks
        run: |
          # shellcheck disable=SC1091
          source .hooks/lib/rust_checks.sh
          run_rust_lint_checks "$GITHUB_WORKSPACE/core"

      - name: Ratchet files may not loosen
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !github.event.created)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # shellcheck disable=SC1091
          source .hooks/lib/rust_checks.sh
          check_ratchets_not_loosened "$GITHUB_WORKSPACE" "$BASE_SHA"

  rust-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: rust-supply-chain

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Install supply-chain tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,typos-cli@1.50.3,cargo-nextest@0.9.146

      - name: Rust supply-chain checks
        run: |
          # shellcheck disable=SC1091
          source .hooks/lib/rust_checks.sh
          run_rust_supply_chain_checks "$GITHUB_WORKSPACE/core"

      - name: Gate self-tests
        run: |
          for self_test in .hooks/tests/*_test.sh; do
            "$self_test"
          done

      - name: cargo deny advisories
        id: advisories
        working-directory: core
        # A new advisory in a transitive dependency must not turn every open pull request red.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          set -o pipefail
          echo "## cargo deny advisories" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo deny --color never check advisories 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  rust-report-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: rust-report-quality

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install report tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat@0.12.1

      - name: Install ast-metrics
        run: bash .github/lib/install_ast_metrics.sh

      - name: Report-only quality tools
        working-directory: core
        run: |
          # shellcheck disable=SC1091
          source ../.github/lib/rust_report_only.sh
          # shellcheck disable=SC1091
          source shipped_features.sh
          outdated_direct_dependencies() {
            local direct updates
            direct=$(cargo metadata --format-version 1 --no-deps --locked \
              | jq -r '[.packages[].dependencies[] | select(.source != null) | .name] | unique | join("|")')
            updates=$(cargo update --dry-run --verbose 2>&1)
            # grep exits 1 when nothing is outdated, and 2 when it fails.
            grep -E "^ +Unchanged ($direct) " <<<"$updates" || [ "$?" -eq 1 ]
          }
          report_section "outdated direct dependencies" \
            --ok 0 --version cargo --version -- \
            outdated_direct_dependencies
          report_section "cargo bloat" \
            --ok 0 --version cargo bloat --version -- \
            cargo bloat --release -p "$BLUEOS_SHIPPED_PACKAGE" --features "${BLUEOS_SHIPPED_FEATURES[*]}" --crates -n 25
          report_section "ast-metrics" \
            --ok 0 --version bash -c "ast-metrics version | grep 'Current version'" -- \
            bash -ec '
              ast-metrics analyze --report-json "$RUNNER_TEMP/ast-metrics.json" libs app services
              test -s "$RUNNER_TEMP/ast-metrics.json"
            '
          report_section "D-31 ergonomics measures" \
            --ok 0 --no-version -- \
            "$GITHUB_WORKSPACE/.hooks/lib/ergonomics_report.sh" "$GITHUB_WORKSPACE"

  rust-nightly:
    runs-on: ubuntu-latest
    env:
      # lockbud links against rustc internals, so it builds and runs only on the nightly its commit names.
      LOCKBUD_TOOLCHAIN: nightly-2026-02-07
      LOCKBUD_REVISION: cc78cb72cb85cb80e596717339cca95ef50c8fe0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load pinned nightly toolchain
        id: nightly
        run: echo "toolchain=$(tr -d '[:space:]' < core/nightly-toolchain.txt)" >> "$GITHUB_OUTPUT"

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: rust-nightly

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          components: rust-src,rustc-dev,llvm-tools-preview,rustfmt

      - name: Install nightly report tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps@0.1.61,cargo-llvm-cov@0.9.1,cargo-nextest@0.9.146

      - name: Install lockbud toolchain
        run: |
          rustup toolchain install "$LOCKBUD_TOOLCHAIN" --profile minimal \
            --component rust-src,rustc-dev,llvm-tools-preview
          echo "$HOME/.lockbud/bin" >> "$GITHUB_PATH"

      # lockbud publishes no binaries, so it is built once per commit and cached.
      - name: Use cached lockbud
        id: lockbud-cache
        uses: actions/cache@v5
        with:
          path: ~/.lockbud
          key: lockbud-${{ env.LOCKBUD_REVISION }}-${{ env.LOCKBUD_TOOLCHAIN }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build lockbud
        if: steps.lockbud-cache.outputs.cache-hit != 'true'
        run: |
          cargo "+$LOCKBUD_TOOLCHAIN" install --locked --root "$HOME/.lockbud" \
            --git https://github.com/BurtonQin/lockbud --rev "$LOCKBUD_REVISION" lockbud

      - name: Nightly checks
        working-directory: core
        run: |
          # shellcheck disable=SC1091
          source ../.github/lib/rust_report_only.sh
          RUST_NIGHTLY=$(tr -d '[:space:]' < nightly-toolchain.txt)
          export RUSTUP_TOOLCHAIN="$RUST_NIGHTLY"
          # The lint job builds on stable, so a warning that only the pinned nightly raises fails here.
          report_section "cargo udeps" \
            --ok 0 --version cargo "+${RUST_NIGHTLY}" udeps --version -- \
            env RUSTFLAGS="-D warnings" cargo "+${RUST_NIGHTLY}" udeps --all-targets --workspace --locked
          report_section "branch coverage summary" \
            --ok 0 --version cargo llvm-cov --version -- \
            bash -ec '
              cargo llvm-cov clean --workspace
              # The trybuild snapshots hold stable compiler messages, which nightly words differently.
              cargo llvm-cov nextest --workspace --locked --branch --no-report -E "not binary(compile_errors)"
              cargo llvm-cov report --branch --summary-only
            '
          report_section "address sanitizer (example domain lib)" \
            --ok 0 --version rustc "+${RUST_NIGHTLY}" --version -- \
            bash -ec "
              export RUSTFLAGS='-Zsanitizer=address -Cdebuginfo=1'
              export ASAN_OPTIONS='detect_leaks=0'
              # An explicit target keeps RUSTFLAGS off proc-macros and build scripts.
              cargo '+${RUST_NIGHTLY}' test -p blueos-example-domain --lib --target x86_64-unknown-linux-gnu \
                -- --test-threads=1
            "
          # lockbud only analyses crates it compiles, so it builds into target folders the cache never restores.
          # It exits 0 whatever it finds, so a finding is read from its log, and the canary's known deadlock proves
          # that it analysed something.
          lockbud_workspace() {
            local crates status=0
            crates=$(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r '[.packages[].targets[].name | gsub("-"; "_")] | unique | join(",")') || return
            [ -n "$crates" ] || return
            (cd ../.github/lockbud-canary && CARGO_TARGET_DIR="$RUNNER_TEMP/lockbud-canary" \
              cargo "+${LOCKBUD_TOOLCHAIN}" lockbud -k deadlock -l lockbud_canary -- --locked) 2>&1 \
              | tee "$RUNNER_TEMP/lockbud-canary.log" || return
            grep -q "crate lockbud_canary contains bugs" "$RUNNER_TEMP/lockbud-canary.log" || return
            CARGO_TARGET_DIR="$RUNNER_TEMP/lockbud" cargo "+${LOCKBUD_TOOLCHAIN}" lockbud -k deadlock -l "$crates" \
              -- --locked 2>&1 | tee "$RUNNER_TEMP/lockbud.log" || return
            grep -q "contains bugs" "$RUNNER_TEMP/lockbud.log" || status=$?
            [ "$status" -eq 1 ]
          }
          report_section "lockbud deadlock" \
            --ok 0 --version cargo "+${LOCKBUD_TOOLCHAIN}" lockbud --version -- \
            lockbud_workspace

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rust-cache (v2.9.2) cleans target/tests/target, a kaos and macrotest folder, without awaiting it, so a
      # target/tests that only trybuild filled logs ENOENT errors on restore and save unless the folder exists.
      - name: Create the folder rust-cache expects under target/tests
        run: mkdir -p core/target/tests/target

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install test tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Rust tests
        run: |
          # shellcheck disable=SC1091
          source .hooks/lib/rust_checks.sh
          run_rust_test_checks "$GITHUB_WORKSPACE/core"

  rust-flake-hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Flake hunt
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !github.event.created)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin
          fi
          # A force push replaces a commit that no branch holds any more.
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"
          .hooks/lib/flake_hunt.sh "$BASE_SHA"

  rust-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # See rust-test.
      - name: Create the folder rust-cache expects under target/tests
        run: mkdir -p core/target/tests/target

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: rust-coverage

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install coverage tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1

      - name: Coverage ratchet
        run: |
          # shellcheck disable=SC1091
          source .hooks/lib/rust_checks.sh
          check_rust_coverage_ratchet "$GITHUB_WORKSPACE/core"

      - name: Coverage summary
        working-directory: core
        # Unfenced, Markdown reads the table's dashed rule as a heading underline and joins its rows.
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust-backend-conformance:
    runs-on: ubuntu-latest
    services:
      zenohd:
        image: eclipse/zenoh:1.9.0
        ports:
          - 7447:7447
    env:
      BLUEOS_ZENOH_ENDPOINT: tcp/127.0.0.1:7447
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: rust-backend-conformance

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: L5 backend conformance (zenohd)
        working-directory: core
        run: cargo test -p blueos-comms-zenoh --test backend_conformance

  rust-cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: "${{ hashFiles('core/Cargo.lock') }}-${{ matrix.target }}"
          shared-key: rust-cross-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-build tools
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5,cargo-auditable@0.7.6

      - name: Cross-build blueos
        working-directory: core
        env:
          TARGETS: ${{ matrix.target }}
        run: ./build_cross.sh

      - name: Binary size report
        working-directory: core
        run: |
          BIN="target/build/${{ matrix.target }}/${{ matrix.target }}/release/blueos"
          ls -lah "${BIN}"
          file "${BIN}"

      - name: Package binary artifact
        working-directory: core
        run: |
          BIN="target/build/${{ matrix.target }}/${{ matrix.target }}/release/blueos"
          tar -czpvf "../blueos-${{ matrix.target }}.tar.gz" "${BIN}"

      - name: Upload blueos artifact
        uses: actions/upload-artifact@v7
        with:
          name: blueos-${{ matrix.target }}
          path: blueos-${{ matrix.target }}.tar.gz
          retention-days: 7

  deploy-docker-images:
    runs-on: ubuntu-latest
    needs: [frontend-tests, python-tests, rust-lint, rust-supply-chain, rust-test, rust-flake-hunt, rust-coverage, rust-cross-build]
    strategy:
      fail-fast: false
      matrix:
        docker: [bootstrap, core]
        project: [blueos]
        platforms: ["linux/arm/v7,linux/arm64/v8,linux/amd64"]
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 #Number of commits to fetch. 0 indicates all history for all branches and tags.
          submodules: recursive

      - name: Download blueos cross-build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: blueos-*
          path: .
          merge-multiple: true

      - name: Extract blueos binaries into core build context
        run: |
          for archive in blueos-*.tar.gz; do
            tar -xzpvf "${archive}" -C core
          done
          ls -lah core/target/build/*/*/release/blueos

      - name: Prepare
        id: prepare
        run: |
          # Deploy image with the name of the branch, if the build is a git tag, replace tag with the tag name.
          # If git tag matches semver, append latest tag to the push.
          DOCKER_IMAGE=${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}
          VERSION=${GITHUB_REF##*/}

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          fi

          TAGS="--tag ${DOCKER_IMAGE}:${VERSION}"
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="$TAGS --tag ${DOCKER_IMAGE}:latest"
          fi

          echo "docker_image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "buildx_args=\
            --build-arg GIT_DESCRIBE_TAGS=$(git describe --tags --long --always) \
            --build-arg VITE_APP_GIT_DESCRIBE=$(git describe --long --always --dirty --all) \
            --cache-from 'type=local,src=/tmp/.buildx-cache' \
            --cache-to 'type=local,dest=/tmp/.buildx-cache' \
            ${TAGS} \
            --file ${{ matrix.docker }}/Dockerfile ./${{ matrix.docker }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Cache Docker layers
        uses: actions/cache@v5
        id: cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.docker }}-${{ hashFiles(format('{0}/Dockerfile', matrix.docker)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.docker }}-${{ hashFiles(format('{0}/Dockerfile', matrix.docker)) }}
            ${{ runner.os }}-buildx-${{ matrix.docker }}

      - name: Docker Buildx (build)
        run: |
          # Pull latest version of image to help with build speed
          for platform in $(echo ${{ matrix.platforms }} | tr ',' '\n'); do
            docker pull --platform ${platform} ${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}:master || true
          done
          docker buildx build \
            --output "type=image,push=false" \
            --platform ${{ matrix.platforms }} \
            ${{ steps.prepare.outputs.buildx_args }}

      - name: Check core size
        if: ${{ matrix.docker == 'core' }}
        run: |
          # Check if the uncompressed image size is lower than our limit.
          # A multi-platform build cannot be loaded into docker, so load only amd64: every layer is a builder cache hit.
          IMAGE=${{ steps.prepare.outputs.docker_image }}:${{ steps.prepare.outputs.version }}
          LIMIT_SIZE_MB=1536
          docker buildx build \
            --load \
            --platform linux/amd64 \
            ${{ steps.prepare.outputs.buildx_args }}
          IMAGE_SIZE_BYTES=$(docker image inspect "${IMAGE}" --format '{{.Size}}')
          if ! [[ "${IMAGE_SIZE_BYTES}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not measure the size of ${IMAGE}, got '${IMAGE_SIZE_BYTES}'"
            exit 1
          fi
          IMAGE_SIZE_MB=$(( IMAGE_SIZE_BYTES / 2**20 ))
          echo "Core size is: ${IMAGE_SIZE_MB} MB (limit ${LIMIT_SIZE_MB} MB)"
          echo "Core amd64 uncompressed size: ${IMAGE_SIZE_MB} MB (limit ${LIMIT_SIZE_MB} MB)" >> $GITHUB_STEP_SUMMARY
          if (( IMAGE_SIZE_BYTES > LIMIT_SIZE_MB * 2**20 )); then
            echo "::error::${IMAGE} is ${IMAGE_SIZE_MB} MB, over the ${LIMIT_SIZE_MB} MB limit"
            exit 1
          fi

      - name: Login to DockerHub
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Buildx (push)
        if: success() && github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --output "type=image,push=true" \
            --platform ${{ matrix.platforms }} \
            ${{ steps.prepare.outputs.buildx_args }}

      - name: Inspect image
        if: always() && github.event_name != 'pull_request'
        run: |
          docker buildx imagetools \
            inspect ${{ steps.prepare.outputs.docker_image }}:${{ steps.prepare.outputs.version }}

      - name: Create image artifact
        if: success() && matrix.docker == 'core'
        run: |
          DOCKER_IMAGE=${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}
          GIT_HASH_SHORT=$(git rev-parse --short "$GITHUB_SHA")
          docker buildx build \
            ${{ steps.prepare.outputs.buildx_args }} \
            --platform "linux/arm64/v8"  \
            --tag ${DOCKER_IMAGE}:${GIT_HASH_SHORT} \
            --output "type=docker,dest=BlueOs-core-docker-image-${GIT_HASH_SHORT}-arm64-v8.tar" \

      - name: Upload artifact arm64-v8
        uses: actions/upload-artifact@v7
        if: success() && matrix.docker == 'core'
        with:
          name: BlueOS-core-docker-image-arm64-v8
          path: '*arm64-v8.tar'

      - name: Create image artifact
        if: success() && matrix.docker == 'core'
        run: |
          DOCKER_IMAGE=${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}
          GIT_HASH_SHORT=$(git rev-parse --short "$GITHUB_SHA")
          docker buildx build \
            ${{ steps.prepare.outputs.buildx_args }} \
            --platform "linux/arm/v7"  \
            --tag ${DOCKER_IMAGE}:${GIT_HASH_SHORT} \
            --output "type=docker,dest=BlueOs-core-docker-image-${GIT_HASH_SHORT}-arm-v7.tar" \

      - name: Upload artifact arm-v7
        uses: actions/upload-artifact@v7
        if: success() && matrix.docker == 'core'
        with:
          name: BlueOS-core-docker-image-arm-v7
          path: '*arm-v7.tar'

      - name: Create image artifact
        if: success() && matrix.docker == 'core'
        run: |
          DOCKER_IMAGE=${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}
          GIT_HASH_SHORT=$(git rev-parse --short "$GITHUB_SHA")
          docker buildx build \
            ${{ steps.prepare.outputs.buildx_args }} \
            --platform "linux/amd64"  \
            --tag ${DOCKER_IMAGE}:${GIT_HASH_SHORT} \
            --output "type=docker,dest=BlueOs-core-docker-image-${GIT_HASH_SHORT}-amd64.tar" \

      - name: Upload artifact amd64
        uses: actions/upload-artifact@v7
        if: success() && matrix.docker == 'core'
        with:
          name: BlueOS-core-docker-image-amd64
          path: '*amd64.tar'

      - name: Upload docker image for release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/') && success() && matrix.docker == 'core'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: '*.tar'
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: true
          file_glob: true

  deploy-raspberry-image:
    needs: deploy-docker-images
    if: github.event_name != 'pull_request' && github.repository_owner == 'bluerobotics'
    timeout-minutes: 180 # Detect if it gets into an infinite loop or some unexpected state
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blueos-ci
            platform: "linux/arm/v7"
            os: "bookworm"
            image: "raspios_lite_armhf/images/raspios_lite_armhf-2024-07-04/2024-07-04-raspios-bookworm-armhf-lite.img.xz"
          - runner: pi4-builder2
            platform: "linux/arm/v7"
            os: "bullseye"
            image: "raspios_lite_armhf/images/raspios_lite_armhf-2022-01-28/2022-01-28-raspios-bullseye-armhf-lite.zip"
          - runner: pi5-builder
            platform: "linux/arm64/v8"
            os: "bookworm"
            image: "raspios_lite_arm64/images/raspios_lite_arm64-2024-07-04/2024-07-04-raspios-bookworm-arm64-lite.img.xz"

    runs-on: ${{ matrix.runner }}
    # The runners for this job are:
    # - pi4-builders: A Raspberry Pi OS Bullseye (32-bit).
    # - pi5-builder: A Raspberry Pi OS Bookworm lite 64-bit.
    # For pi5-ci, install docker (curl -sSL https://get.docker.com/ | sh) and follow the instructions for setting up a new runner in
    # https://github.com/bluerobotics/BlueOS/settings/actions/runners/new

    steps:
      - name: Install git
        run: sudo apt install -y git

      - name: Install pip
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt update
          sudo apt install -y python3-pip

      # Clean up leftover directories from previous runs that may have restrictive permissions
      - name: Pre-checkout cleanup
        run: |
          sudo rm -rf unfor19-awscli .cache deploy || true
          # Clean up any leftover loop devices from previous failed runs
          sudo losetup -D || true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # We have self-hosted runners for both arm and arm64, so we need to install awscli for both architectures
      # Install system-wide to ensure aws is accessible in PATH at /usr/local/bin
      - name: Install awscli
        run: sudo pip3 install awscli --break-system-packages || sudo pip3 install awscli

      # We use our own pimod as upstream doesn't provide armv7 images
      - name: Pimod Build
        run: |
          PIMOD_VERSION=v0.7.0
          VERSION=$GITHUB_REPOSITORY
          VERSION=${VERSION:-master}
          wget https://raw.githubusercontent.com/Nature40/pimod/${PIMOD_VERSION}/pimod.sh && chmod +x pimod.sh
          docker run --rm --privileged \
            -v $PWD:/files \
            -e PATH=/pimod:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e GITHUB_REPOSITORY=$GITHUB_REPOSITORY \
            -e VERSION=$GITHUB_REF_NAME \
            -e BASE_IMAGE=${{ matrix.image }} \
            --workdir=/files \
            --platform ${{ matrix.platform }} nature40/pimod:${PIMOD_VERSION} pimod.sh deploy/pimod/blueos.Pifile

      - name: Add /boot additions
        run: |
          # configure_board.sh dispatches on the host device tree, so the board configuration the image
          # must end up with is decided by the runner's own hardware, not by the image it builds.
          case "${{ matrix.runner }}" in
            pi5-builder)
              EXPECTED=("[pi5]" "dtoverlay=i2c3-pi5,baudrate=400000" "dtoverlay=spi1-3cs")
              ;;
            blueos-ci|pi4-builder2)
              EXPECTED=("[pi4]" "dtoverlay=i2c4,pins_6_7,baudrate=1000000" "dtoverlay=spi1-3cs")
              ;;
            *)
              echo "Unknown runner ${{ matrix.runner }}, add the board configuration its image must contain."
              exit 1
              ;;
          esac
          sudo apt-get update && sudo apt-get install -y parted kpartx
          # Create mount point if it doesn't exist
          sudo mkdir -p /mnt/piboot
          # Map the image file
          LOOP_DEVICE=$(sudo kpartx -avs deploy/pimod/blueos.img | sed -E 's/.*(loop[0-9]+)p[0-9]+.*/\1/g' | head -1)
          # Mount the boot partition
          sudo mount "/dev/mapper/${LOOP_DEVICE}p1" /mnt/piboot
          # Create ssh and userconf files
          sudo cp install/boards/config.toml /mnt/piboot/custom.toml
          # A board install script writing to the /boot stub instead of the boot partition still exits 0,
          # so the image itself is the only place where a missing Navigator configuration can be caught.
          MISSING=()
          for LINE in "${EXPECTED[@]}"; do
            sudo grep -qxF "$LINE" /mnt/piboot/config.txt || MISSING+=("config.txt: $LINE")
          done
          # cmdline.txt is reached through its own path and can be left behind on its own. Whatever
          # board this is, the memory cgroup docker needs is enabled and the serial console that
          # would hold the autopilot port is dropped.
          sudo grep -q "cgroup_enable=memory" /mnt/piboot/cmdline.txt || MISSING+=("cmdline.txt: cgroup_enable=memory")
          if sudo grep -q "console=serial" /mnt/piboot/cmdline.txt; then
            MISSING+=("cmdline.txt: console=serial is still there")
          fi
          sudo umount /mnt/piboot
          sudo kpartx -d deploy/pimod/blueos.img
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "Missing from the boot partition of the ${{ matrix.os }} ${{ matrix.platform }} image built on ${{ matrix.runner }}:"
            printf '  %s\n' "${MISSING[@]}"
            echo "The board install script did not configure the image's boot partition."
            exit 1
          fi
          echo "Boot partition updated successfully."

      - name: Sanitize platform name
        run: echo "SANITIZED_PLATFORM=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_ENV

      - name: Set asset name
        run: |
          if [[ ${{ matrix.runner }} == 'pi5-builder' ]]; then
            echo "ASSET_NAME_SUFFIX=-pi5" >> $GITHUB_ENV
          elif [[ ${{ matrix.os }} == 'bullseye' ]]; then
            echo "ASSET_NAME_SUFFIX=-pi4" >> $GITHUB_ENV
          fi

      - name: Print image checksum
        run: sha256sum deploy/pimod/blueos.img

      - name: Zip image
        run: |
          sudo apt install zip
          zip -9 -s 2000m BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.zip deploy/pimod/blueos.img
          ls -lah BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        timeout-minutes: 120
        with:
          name: BlueOS-raspberry-${{ env.GITHUB_REF_NAME }}${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}
          path: BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.z*
          if-no-files-found: error
          retention-days: 7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to S3
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aws s3 cp deploy/pimod/blueos.img s3://blueos-downloads/releases/${{ github.ref_name }}/BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.img

      - name: Upload raspberry image for release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Matches single .zip or multi-volume .z01, .z02, ..., .zip
          file: BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.z*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: true

      # This is required because docker has root permissions, which means the runner is unable to clear this cache normally
      - name: Cleanup
        if: ${{ always() }}
        run: |
          sudo rm -rf .cache deploy || true
          sudo losetup -D || true
