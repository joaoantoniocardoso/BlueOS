name: Test, Build and Deploy Images

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

on:
    workflow_dispatch:
    pull_request:
    push:
    schedule:
    # Run every 6 days to keep our caches alive
    - cron: '0 0 */6 * *'

jobs:
  python-tests:
    runs-on: ubuntu-latest

    env:
      python-version: 3.11 # Our base image has Python 3.11

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ env.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get install --no-install-recommends --assume-yes shellcheck parallel

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v8.0.0

    - name: Run tests
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        .hooks/pre-push

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: ./core/htmlcov
        if-no-files-found: ignore


  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bun install
        run: bun install --frozen-lockfile --cwd ./core/frontend

      - name: Bun lint
        run: bun --cwd ./core/frontend lint

      - name: Bun type-check
        run: bun run --cwd ./core/frontend type-check

      - name: Bun build
        run: NODE_OPTIONS=--max-old-space-size=8192 bun run --cwd ./core/frontend build

  build-docker-images:
    runs-on: ${{ matrix.runner }}
    needs: [frontend-tests, python-tests]
    strategy:
      fail-fast: false
      matrix:
        docker: [bootstrap, core]
        project: [blueos]
        platform: [linux/amd64, linux/arm64/v8, linux/arm/v7]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
          # Neoverse N2 hosts cannot run 32-bit code natively, so this one stays emulated.
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 #Number of commits to fetch. 0 indicates all history for all branches and tags.
          submodules: recursive

      - name: Prepare
        id: prepare
        run: |
          DOCKER_IMAGE=${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}
          PLATFORM_SLUG=$(echo ${{ matrix.platform }} | tr '/' '-')
          PLATFORM_SUFFIX=${PLATFORM_SLUG#linux-}
          GIT_HASH_SHORT=$(git rev-parse --short "$GITHUB_SHA")

          echo "docker_image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
          echo "platform_slug=${PLATFORM_SLUG}" >> $GITHUB_OUTPUT
          echo "platform_suffix=${PLATFORM_SUFFIX}" >> $GITHUB_OUTPUT
          echo "git_hash_short=${GIT_HASH_SHORT}" >> $GITHUB_OUTPUT
          # Fixed epoch. rewrite-timestamp applies this to every layer, so a build time
          # would give unchanged layers a new digest on every release.
          echo "SOURCE_DATE_EPOCH=0" >> $GITHUB_ENV
          COMMIT_DATE_ARG=""
          if [[ "${{ matrix.docker }}" == "core" ]]; then
            COMMIT_DATE_ARG="--build-arg GIT_COMMIT_DATE=$(git log -1 --format=%cI)"
          fi
          # Every build reads the registry cache. Only master writes it: one shared tag per platform,
          # so concurrent pushes from other refs would overwrite each other. Tags are left out on
          # purpose: they are cut from master, whose push already wrote the cache.
          REGISTRY_CACHE=type=registry,ref=${DOCKER_IMAGE}:buildcache-${PLATFORM_SUFFIX}
          CACHE_TO=""
          if [[ "${GITHUB_REF}" == 'refs/heads/master' && "${{ github.event_name }}" != 'pull_request' ]]; then
            CACHE_TO="--cache-to ${REGISTRY_CACHE},mode=max"
          fi
          echo "buildx_args=\
            --build-arg GIT_DESCRIBE_TAGS=$(git describe --tags --long --always) \
            ${COMMIT_DATE_ARG} \
            --cache-from 'type=local,src=/tmp/.buildx-cache' \
            --cache-from ${REGISTRY_CACHE} \
            --cache-to 'type=local,dest=/tmp/.buildx-cache' \
            ${CACHE_TO} \
            --platform ${{ matrix.platform }} \
            --file ${{ matrix.docker }}/Dockerfile ./${{ matrix.docker }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Cache Docker layers
        uses: actions/cache@v5
        id: cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.docker }}-${{ steps.prepare.outputs.platform_slug }}-${{ hashFiles(format('{0}/Dockerfile', matrix.docker)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.docker }}-${{ steps.prepare.outputs.platform_slug }}-${{ hashFiles(format('{0}/Dockerfile', matrix.docker)) }}
            ${{ runner.os }}-buildx-${{ matrix.docker }}-${{ steps.prepare.outputs.platform_slug }}

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Buildx (build)
        run: |
          # Pull latest version of image to help with build speed
          docker pull --platform ${{ matrix.platform }} ${{ steps.prepare.outputs.docker_image }}:master || true

          OUTPUTS=()
          # The registry keeps the layers by digest. The merge job joins the platforms under the tags.
          if [[ "${{ github.event_name }}" != 'pull_request' ]]; then
            OUTPUTS+=(--output "type=image,name=${{ steps.prepare.outputs.docker_image }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true")
          fi
          if [[ "${{ matrix.docker }}" == "core" ]]; then
            OUTPUTS+=(--output "type=docker,name=${{ steps.prepare.outputs.docker_image }}:${{ steps.prepare.outputs.git_hash_short }},dest=BlueOs-core-docker-image-${{ steps.prepare.outputs.git_hash_short }}-${{ steps.prepare.outputs.platform_suffix }}.tar,rewrite-timestamp=true")
          fi
          if [[ ${#OUTPUTS[@]} -eq 0 ]]; then
            OUTPUTS+=(--output "type=image,push=false,rewrite-timestamp=true")
          fi

          docker buildx build \
            --metadata-file /tmp/build-metadata.json \
            "${OUTPUTS[@]}" \
            ${{ steps.prepare.outputs.buildx_args }}

      - name: Check core size
        if: matrix.docker == 'core' && matrix.platform == 'linux/amd64'
        run: |
          # The tarball keeps its layers compressed, so this is the size a vehicle downloads.
          LIMIT_SIZE_MB=700
          IMAGE_SIZE_MB=$(( $(stat --format %s BlueOs-core-docker-image-${{ steps.prepare.outputs.git_hash_short }}-${{ steps.prepare.outputs.platform_suffix }}.tar)/(2**20) ))
          echo "Core compressed size is: $IMAGE_SIZE_MB MB (limit $LIMIT_SIZE_MB MB)"
          ((IMAGE_SIZE_MB < LIMIT_SIZE_MB))

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.docker }}-${{ steps.prepare.outputs.platform_slug }}
          path: /tmp/digests/*
          if-no-files-found: error

      - name: Upload artifact
        if: matrix.docker == 'core'
        uses: actions/upload-artifact@v7
        with:
          name: BlueOS-core-docker-image-${{ steps.prepare.outputs.platform_suffix }}
          path: '*.tar'

  deploy-docker-images:
    runs-on: ubuntu-latest
    needs: build-docker-images
    strategy:
      fail-fast: false
      matrix:
        docker: [bootstrap, core]
        project: [blueos]
    steps:
      - name: Prepare
        id: prepare
        run: |
          # Deploy image with the name of the branch, if the build is a git tag, replace tag with the tag name.
          # If git tag matches semver, append latest tag to the push.
          DOCKER_IMAGE=${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}
          VERSION=${GITHUB_REF##*/}

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          fi

          TAGS="--tag ${DOCKER_IMAGE}:${VERSION}"
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="$TAGS --tag ${DOCKER_IMAGE}:latest"
          fi

          echo "docker_image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Download digests
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.docker }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-platform image
        if: github.event_name != 'pull_request'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ steps.prepare.outputs.tags }} \
            $(printf '${{ steps.prepare.outputs.docker_image }}@sha256:%s ' *)

      - name: Inspect image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools \
            inspect ${{ steps.prepare.outputs.docker_image }}:${{ steps.prepare.outputs.version }}

      - name: Download image artifacts
        if: startsWith(github.ref, 'refs/tags/') && matrix.docker == 'core'
        uses: actions/download-artifact@v7
        with:
          pattern: BlueOS-core-docker-image-*
          merge-multiple: true

      - name: Upload docker image for release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/') && success() && matrix.docker == 'core'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: '*.tar'
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: true
          file_glob: true

  deploy-raspberry-image:
    needs: deploy-docker-images
    if: github.event_name != 'pull_request' && github.repository_owner == 'bluerobotics'
    timeout-minutes: 180 # Detect if it gets into an infinite loop or some unexpected state
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blueos-ci
            platform: "linux/arm/v7"
            os: "bookworm"
            image: "raspios_lite_armhf/images/raspios_lite_armhf-2024-07-04/2024-07-04-raspios-bookworm-armhf-lite.img.xz"
          - runner: pi4-builder2
            platform: "linux/arm/v7"
            os: "bullseye"
            image: "raspios_lite_armhf/images/raspios_lite_armhf-2022-01-28/2022-01-28-raspios-bullseye-armhf-lite.zip"
          - runner: pi5-builder
            platform: "linux/arm64/v8"
            os: "bookworm"
            image: "raspios_lite_arm64/images/raspios_lite_arm64-2024-07-04/2024-07-04-raspios-bookworm-arm64-lite.img.xz"

    runs-on: ${{ matrix.runner }}
    # The runners for this job are:
    # - pi4-builders: A Raspberry Pi OS Bullseye (32-bit).
    # - pi5-builder: A Raspberry Pi OS Bookworm lite 64-bit.
    # For pi5-ci, install docker (curl -sSL https://get.docker.com/ | sh) and follow the instructions for setting up a new runner in
    # https://github.com/bluerobotics/BlueOS/settings/actions/runners/new

    steps:
      - name: Install git
        run: sudo apt install -y git

      - name: Install pip
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt update
          sudo apt install -y python3-pip

      # Clean up leftover directories from previous runs that may have restrictive permissions
      - name: Pre-checkout cleanup
        run: |
          sudo rm -rf unfor19-awscli .cache deploy || true
          # Clean up any leftover loop devices from previous failed runs
          sudo losetup -D || true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # We have self-hosted runners for both arm and arm64, so we need to install awscli for both architectures
      # Install system-wide to ensure aws is accessible in PATH at /usr/local/bin
      - name: Install awscli
        run: sudo pip3 install awscli --break-system-packages || sudo pip3 install awscli

      # We use our own pimod as upstream doesn't provide armv7 images
      - name: Pimod Build
        run: |
          PIMOD_VERSION=v0.7.0
          VERSION=$GITHUB_REPOSITORY
          VERSION=${VERSION:-master}
          wget https://raw.githubusercontent.com/Nature40/pimod/${PIMOD_VERSION}/pimod.sh && chmod +x pimod.sh
          docker run --rm --privileged \
            -v $PWD:/files \
            -e PATH=/pimod:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e GITHUB_REPOSITORY=$GITHUB_REPOSITORY \
            -e VERSION=$GITHUB_REF_NAME \
            -e BASE_IMAGE=${{ matrix.image }} \
            --workdir=/files \
            --platform ${{ matrix.platform }} nature40/pimod:${PIMOD_VERSION} pimod.sh deploy/pimod/blueos.Pifile

      - name: Add /boot additions
        run: |
          # configure_board.sh dispatches on the host device tree, so the board configuration the image
          # must end up with is decided by the runner's own hardware, not by the image it builds.
          case "${{ matrix.runner }}" in
            pi5-builder)
              EXPECTED=("[pi5]" "dtoverlay=i2c3-pi5,baudrate=400000" "dtoverlay=spi1-3cs")
              ;;
            blueos-ci|pi4-builder2)
              EXPECTED=("[pi4]" "dtoverlay=i2c4,pins_6_7,baudrate=1000000" "dtoverlay=spi1-3cs")
              ;;
            *)
              echo "Unknown runner ${{ matrix.runner }}, add the board configuration its image must contain."
              exit 1
              ;;
          esac
          sudo apt-get update && sudo apt-get install -y parted kpartx
          # Create mount point if it doesn't exist
          sudo mkdir -p /mnt/piboot
          # Map the image file
          LOOP_DEVICE=$(sudo kpartx -avs deploy/pimod/blueos.img | sed -E 's/.*(loop[0-9]+)p[0-9]+.*/\1/g' | head -1)
          # Mount the boot partition
          sudo mount "/dev/mapper/${LOOP_DEVICE}p1" /mnt/piboot
          # Create ssh and userconf files
          sudo cp install/boards/config.toml /mnt/piboot/custom.toml
          # A board install script writing to the /boot stub instead of the boot partition still exits 0,
          # so the image itself is the only place where a missing Navigator configuration can be caught.
          MISSING=()
          for LINE in "${EXPECTED[@]}"; do
            sudo grep -qxF "$LINE" /mnt/piboot/config.txt || MISSING+=("config.txt: $LINE")
          done
          # cmdline.txt is reached through its own path and can be left behind on its own. Whatever
          # board this is, the memory cgroup docker needs is enabled and the serial console that
          # would hold the autopilot port is dropped.
          sudo grep -q "cgroup_enable=memory" /mnt/piboot/cmdline.txt || MISSING+=("cmdline.txt: cgroup_enable=memory")
          if sudo grep -q "console=serial" /mnt/piboot/cmdline.txt; then
            MISSING+=("cmdline.txt: console=serial is still there")
          fi
          sudo umount /mnt/piboot
          sudo kpartx -d deploy/pimod/blueos.img
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "Missing from the boot partition of the ${{ matrix.os }} ${{ matrix.platform }} image built on ${{ matrix.runner }}:"
            printf '  %s\n' "${MISSING[@]}"
            echo "The board install script did not configure the image's boot partition."
            exit 1
          fi
          echo "Boot partition updated successfully."

      - name: Sanitize platform name
        run: echo "SANITIZED_PLATFORM=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_ENV

      - name: Set asset name
        run: |
          if [[ ${{ matrix.runner }} == 'pi5-builder' ]]; then
            echo "ASSET_NAME_SUFFIX=-pi5" >> $GITHUB_ENV
          elif [[ ${{ matrix.os }} == 'bullseye' ]]; then
            echo "ASSET_NAME_SUFFIX=-pi4" >> $GITHUB_ENV
          fi

      - name: Print image checksum
        run: sha256sum deploy/pimod/blueos.img

      - name: Zip image
        run: |
          sudo apt install zip
          zip -9 -s 2000m BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.zip deploy/pimod/blueos.img
          ls -lah BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        timeout-minutes: 120
        with:
          name: BlueOS-raspberry-${{ env.GITHUB_REF_NAME }}${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}
          path: BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.z*
          if-no-files-found: error
          retention-days: 7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to S3
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aws s3 cp deploy/pimod/blueos.img s3://blueos-downloads/releases/${{ github.ref_name }}/BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.img

      - name: Upload raspberry image for release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Matches single .zip or multi-volume .z01, .z02, ..., .zip
          file: BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.z*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: true

      # This is required because docker has root permissions, which means the runner is unable to clear this cache normally
      - name: Cleanup
        if: ${{ always() }}
        run: |
          sudo rm -rf .cache deploy || true
          sudo losetup -D || true
