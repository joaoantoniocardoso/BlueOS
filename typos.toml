# Spell check for the Rust workspace and every service (D-30). The legacy Python libraries and the frontend are out
# of scope until migrated.

[default]
# A persisted MAVLink endpoint name: renaming it would add a second endpoint to every vehicle that upgrades.
extend-ignore-re = ['name="Zenoh Deamon"']

[default.extend-words]
# Python services name pyroute2's output interface argument, ArduPilot's simulator and its parameter files.
oif = "oif"
sitl = "sitl"
parm = "parm"

[files]
extend-exclude = [
    "core/frontend/**",
    "core/libs/commonwealth/**",
    "**/tests/vectors/**",
    "core/tools/**",
    "core/uv.lock",
    "deploy/**",
    "bootstrap/**",
    "docs/architecture/draft-1/**",
    "**/idl/catalog/**",
    "**/idl/src/generated/schema_catalog.rs",
    "**/idl/typescript/catalog.ts",
]
