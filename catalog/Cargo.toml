[package]
name = "blueos-catalog"
version = "0.1.0"
edition = "2021"

[dependencies]
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[[bin]]
name = "export"
path = "src/bin/export.rs"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"

[[bin]]
name = "drift"
path = "src/bin/drift.rs"

[[bin]]
name = "cluster"
path = "src/bin/cluster.rs"

[[bin]]
name = "features"
path = "src/bin/features.rs"

[[bin]]
name = "coverage"
path = "src/bin/coverage.rs"
