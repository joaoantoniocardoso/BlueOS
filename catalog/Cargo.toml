[package]
name = "blueos-catalog"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "1"

[[bin]]
name = "route_lint"
path = "src/bin/route_lint.rs"

[[bin]]
name = "export"
path = "src/bin/export.rs"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"

[[bin]]
name = "drift"
path = "src/bin/drift.rs"

[[bin]]
name = "cluster"
path = "src/bin/cluster.rs"

[[bin]]
name = "features"
path = "src/bin/features.rs"

[[bin]]
name = "coverage"
path = "src/bin/coverage.rs"

[[bin]]
name = "journey_http"
path = "src/bin/journey_http.rs"

[[bin]]
name = "wbs"
path = "src/bin/wbs.rs"

[[bin]]
name = "frontend_smoke"
path = "src/bin/frontend_smoke.rs"

[[bin]]
name = "tier1_coverage"
path = "src/bin/tier1_coverage.rs"

[[bin]]
name = "tier2_coverage"
path = "src/bin/tier2_coverage.rs"

[[bin]]
name = "generate_feature_presence"
path = "src/bin/generate_feature_presence.rs"

[[bin]]
name = "enrich_feature_traces"
path = "src/bin/enrich_feature_traces.rs"

[[bin]]
name = "feature_trace_report"
path = "src/bin/feature_trace_report.rs"

[[bin]]
name = "sibling_matrix"
path = "src/bin/sibling_matrix.rs"

[[bin]]
name = "feature_trace_diff"
path = "src/bin/feature_trace_diff.rs"

[[bin]]
name = "export_feature_provenance"
path = "src/bin/export_feature_provenance.rs"

[[bin]]
name = "journey_matrix"
path = "src/bin/journey_matrix.rs"
